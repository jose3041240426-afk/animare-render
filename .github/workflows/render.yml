name: Render

on:
  push:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure headless browser
        run: npx remotion browser ensure

      - name: Render MP4
        run: npx remotion render src/index.ts AnimareDev out/video.mp4

      - name: Verify with ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_frames,codec_name,pix_fmt -of default=noprint_wrappers=1 out/video.mp4
          ls -lh out/video.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: animare-mp4
          path: out/video.mp4
          retention-days: 7
          if-no-files-found: error
